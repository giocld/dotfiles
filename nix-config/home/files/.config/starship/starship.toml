add_newline = false

[aws]
disabled = true

[battery]
disabled = true

[character]
success_symbol = "[󰆹](bold #a89984)"
error_symbol = "[󰆹](bold #a0443d)"
vicmd_symbol = "[](bold #504a45)"

[cmd_duration]

[conda]

[directory]
style = "bold #796d62"
truncation_length = 3

[dotnet]
disabled = true

[env_var]
disabled = true

[elixir]
symbol = " "

[elm]
symbol = " "

[git_branch]
symbol = " "
style = "bold #655b54"

[git_commit]
disabled = false
commit_hash_length = 4

[git_state]
disabled = true

[git_status]
style = "bold #6e645b"
conflicted = "=${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "\\$${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[gcloud]
disabled = true

[golang]
symbol = " "

[hostname]
style = "#504a45"

[jobs]

[kubernetes]
symbol = " "
disabled = false

[line_break]
disabled = false

[lua]
symbol = " "
lua_binary = "luajit"

[nix_shell]
disabled = true

[memory_usage]
disabled = true

[java]
symbol = " "

[julia]

[nim]

[nodejs]
symbol = " "

[package]
symbol = " "

[php]
symbol = " "
detect_extensions = []
detect_files = ['composer.json', '.php-version']

[python]
symbol = " "

[ruby]
symbol = " "

[rust]
symbol = " "

[scala]
symbol = " "

[terraform]
symbol = " "
format = "via [$symbol$version]($style)"

[time]
disabled = true

[username]
disabled = false
style_user = "#655b54"
style_root = "#a0443d"
